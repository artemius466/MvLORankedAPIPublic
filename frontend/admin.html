<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — MvLO Ranked</title>
<meta name="description" content="MvLO Ranked admin panel — users and matches.">
<meta name="robots" content="noindex,nofollow">
<meta name="mvlo-api-base" content="">
<link rel="stylesheet" href="css/style.css">
<style>body{visibility:hidden}</style>
</head>
<body>

<div style="min-height:100vh;position:relative;overflow:hidden;padding-bottom:132px;background:linear-gradient(#4a7bf0 0%,#5c94fc 40%,#8fc2ff 100%)">

  <div style="position:absolute;bottom:0;left:0;width:100%;height:118px;pointer-events:none">
    <div style="position:absolute;bottom:64px;left:0;width:100%;height:66px;background-image:url('assets/qblock.png'),url('assets/qblock.png'),url('assets/qblock.png');background-repeat:no-repeat;background-size:54px 66px;background-position:14% bottom,50% bottom,86% bottom"></div>
    <div style="position:absolute;bottom:0;left:0;width:100%;height:64px;background:linear-gradient(#63c74d 0 10px,#3a9c34 10px 20px,#7a4a1e 20px,#5a3413 100%);border-top:5px solid #17161d;box-shadow:inset 0 24px 0 -18px #ffffff40"></div>
  </div>

  <div style="position:relative;max-width:1180px;margin:0 auto;padding:34px 18px 0">

    <header style="margin-bottom:22px">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/" class="back-link">◄ BACK</a>
        <span id="breadcrumb-current" class="breadcrumb-current" aria-current="page">ADMIN</span>
      </nav>
      <h1 style="margin:14px 0 0;font:clamp(36px,6.4vw,60px)/1 'MarioUI';color:#fff;letter-spacing:2px;text-shadow:5px 5px 0 #17161d,10px 10px 0 rgba(23,22,29,.28)">ADMIN PANEL</h1>
    </header>

    <main style="background:#fdf3d7;border:5px solid #17161d;box-shadow:inset 0 0 0 4px #fff,10px 10px 0 rgba(23,22,29,.32);padding:24px;position:relative;z-index:2">

      <div id="admin-gate" class="auth-gate" hidden>
        <span class="auth-gate-icon"></span>
        <h2 style="margin:0;font:26px 'MarioUI';color:#17161d;letter-spacing:1px">ACCESS DENIED</h2>
        <p id="admin-gate-text" style="margin:0;font:16px/1.5 'MarioUI';color:#4c4634;max-width:40ch">Only authorized accounts may open the admin panel.</p>
        <button class="discord-btn" id="admin-login" hidden>LOGIN WITH DISCORD</button>
      </div>

      <div id="admin-panel" hidden>

        <nav style="display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;position:relative;z-index:3;padding-left:8px;margin-bottom:18px">
          <button class="tab-btn admin-tab active" data-tab="users">USERS</button>
          <button class="tab-btn admin-tab" data-tab="matches">MATCHES</button>
          <button class="tab-btn admin-tab" data-tab="announcements">ANNOUNCEMENTS</button>
        </nav>

        <section id="panel-users">
          <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h2 style="margin:0;font:30px 'MarioUI';color:#17161d;letter-spacing:1px">ALL USERS</h2>
            <form id="users-search" style="display:flex;gap:8px;align-items:center">
              <input name="q" class="admin-input" placeholder="Name or Discord ID" autocomplete="off">
              <button class="pager-btn" type="submit">SEARCH</button>
            </form>
          </div>
          <div id="admin-users" style="display:flex;flex-direction:column;gap:8px"></div>
          <div id="admin-users-pager" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin-top:14px"></div>
        </section>

        <section id="panel-matches" hidden>
          <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h2 style="margin:0;font:30px 'MarioUI';color:#17161d;letter-spacing:1px">ALL MATCHES</h2>
            <form id="matches-search" style="display:flex;gap:8px;align-items:center">
              <input name="q" class="admin-input" placeholder="Match ID, player name or ID" autocomplete="off">
              <button class="pager-btn" type="submit">SEARCH</button>
            </form>
          </div>
          <div id="admin-matches" style="display:flex;flex-direction:column;gap:8px"></div>
          <div id="admin-matches-pager" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin-top:14px"></div>
        </section>

        <section id="panel-announcements" hidden>
          <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h2 style="margin:0;font:30px 'MarioUI';color:#17161d;letter-spacing:1px">ANNOUNCEMENTS</h2>
            <button id="btn-new-announcement" class="pager-btn" style="background:#3fbb35;color:#fff" type="button">+ NEW ANNOUNCEMENT</button>
          </div>
          <div id="admin-announcements" style="display:flex;flex-direction:column;gap:10px"></div>
        </section>

      </div>

    </main>

    <p style="margin:18px 0 0;font:15px 'MarioUI';color:#fff;text-shadow:3px 3px 0 #17161d">UNOFFICIAL COMMUNITY PROJECT.</p>
  </div>
</div>

<div id="auth-error" hidden></div>

<script src="js/map-names.js"></script>
<script src="js/match-detail.js"></script>
<script src="js/auth.js"></script>
<script src="js/markdown.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
